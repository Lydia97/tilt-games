<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歪一歪 · 倾斜手机小游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:#f6efe4;color:#3a2e2a;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:32px;letter-spacing:2px}
.sub{color:#8f8378;font-size:14px;margin-top:6px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:12px;margin-top:22px}
a.g{display:flex;gap:14px;align-items:center;background:#fffaf2;border-radius:18px;padding:16px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(60,40,30,.08);transition:transform .08s}
a.g:active{transform:scale(.98)}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px}
.g b{display:block;font-size:17px}
.g span{display:block;font-size:13px;color:#8f8378;margin-top:3px;line-height:1.5}
.tip{margin-top:22px;font-size:12px;color:#8f8378;line-height:1.7;background:#fffaf2;border-radius:14px;padding:12px 14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>歪一歪</h1>
  <div class="sub">用手机打开，左右倾斜手机来玩的 5 个小游戏</div>
  <div class="list">
    <a class="g" href="cat-statue.html"><div class="ic" style="background:#ffe8cf">🐱</div><div><b>一二三木头人</b><span>趁猫咪闭眼数数时绕到它背后，摸一下尾巴</span></div></a>
    <a class="g" href="cat-secret.html"><div class="ic" style="background:#fde3e3">🔍</div><div><b>背后藏了什么</b><span>猫咪干了坏事，证据藏在它背后，绕过去找</span></div></a>
    <a class="g" href="appraiser.html"><div class="ic" style="background:#dfe9f5">🏺</div><div><b>小小鉴宝师</b><span>绕着青花瓷看一圈，找出赝品的破绽</span></div></a>
    <a class="g" href="lantern-ghosts.html"><div class="ic" style="background:#e6e1f7">🏮</div><div><b>提灯赶小鬼</b><span>转身用灯照走四面八方飘来的小团子鬼</span></div></a>
    <a class="g" href="tilt-match.html"><div class="ic" style="background:#e3f1e6">🧭</div><div><b>转到这里</b><span>倾斜手机，转到目标视角</span></div></a>
  </div>
  <div class="tip">iPhone 第一次点「开始」时会询问能否使用“运动与方向”，请点允许。<br>电脑上打开没有倾斜感应，可以用拖动画面来玩。</div>
</div>
</body>
</html>
