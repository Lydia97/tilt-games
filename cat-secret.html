<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>背后藏了什么 · 猫咪侦探</title>
<style>
:root{--ink:#3a2e2a;--muted:#9a8a80;--cream:#fff8ee;--gold:#f4a65e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3dfc8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.panel{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);background:rgba(90,70,60,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.panel.on{display:flex}
.card{margin:auto 0;background:var(--cream);border-radius:26px;padding:24px 20px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 40px rgba(60,40,30,.22)}
h1{font-size:30px;letter-spacing:2px}
.sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.6}
.rules{text-align:left;margin:14px 0 4px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.rules div{display:flex;gap:10px;align-items:flex-start}
.rules b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:12px}
button{font:inherit;border:0;border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer;width:100%;color:#fff;background:var(--ink);margin-top:12px;transition:transform .08s}
button:active{transform:scale(.97)}
button.soft{background:#f3e6d6;color:var(--ink);font-weight:600;font-size:15px}
button:disabled{opacity:.4}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.lv{border-radius:14px;background:#f3e6d6;padding:4px 0 3px;cursor:pointer;border:2px solid transparent;font-size:11px;font-weight:600}
.lv canvas{display:block;margin:0 auto;width:52px;height:52px}
.lv small{display:block;font-size:9px;color:#e0a43a;height:11px;letter-spacing:-1px}
.lv.lock{opacity:.35;cursor:default}
.lv.cur{border-color:var(--gold);background:#fff0dc}

.portrait{display:block;margin:6px auto 0;border-radius:18px}
.case{background:#fff0dc;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.6;margin-top:10px;text-align:left}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{background:#fff;border:2px solid #f1e3d0;border-radius:14px;padding:12px;text-align:left;font-size:15px;cursor:pointer}
.opt:active{border-color:var(--gold)}
.opt.bad{opacity:.4;text-decoration:line-through;pointer-events:none}
.clues{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.clues span{background:#fff;border-radius:10px;padding:4px 9px;font-size:12px;border:1px solid #f1e3d0}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:none;justify-content:center;gap:8px;pointer-events:none}
.hud.on{display:flex}
.hud button{pointer-events:auto;width:auto;margin:0;padding:6px 11px;font-size:12px;font-weight:600;border-radius:10px;background:rgba(58,46,42,.55);color:#fff}
.answerBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);width:min(340px,calc(100% - 40px));display:none}
.answerBar.on{display:block}
.answerBar button{margin:0;box-shadow:0 6px 20px rgba(60,40,30,.25)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 175px);transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(60,40,30,.15)}

</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud"><button id="bCal">校准</button><button id="bMute">声音：开</button><button id="bPause">暂停</button></div>
<div class="answerBar" id="answerBar"><button id="bAnswer" disabled>再找找线索（0/3）</button></div>
<div class="toast" id="toast"></div>

<section class="panel on" id="pStart">
  <div class="card">
    <h1>背后藏了什么</h1>
    <div class="sub">每只猫咪都干了件坏事，证据就藏在它背后</div>
    <div class="rules">
      <div><b>1</b><span>左右倾斜手机绕着猫咪走（也可以拖动画面）。</span></div>
      <div><b>2</b><span>猫咪会<strong>一直转身挡住你</strong>，绕得够快才能看到它背后。</span></div>
      <div><b>3</b><span>看到可疑的东西就<strong>点一下</strong>收集线索，找到至少 2 条就能推理它干了什么。</span></div>
    </div>
    <div class="lvgrid" id="lvGrid"></div>
    <button id="bStart">开始</button>
  </div>
</section>

<section class="panel" id="pIntro">
  <div class="card">
    <div class="sub" id="iNum"></div>
    <canvas class="portrait" id="iPic"></canvas>
    <h1 style="font-size:26px;margin-top:6px" id="iName"></h1>
    <div class="case" id="iCase"></div>
    <button id="bGo">开始调查</button>
    <button class="soft" id="bIntroBack">回到首页</button>
  </div>
</section>

<section class="panel" id="pAsk">
  <div class="card">
    <div class="sub">你找到的线索</div>
    <div class="clues" id="aClues"></div>
    <h1 style="font-size:22px;margin-top:14px" id="aQ"></h1>
    <div class="opts" id="aOpts"></div>
    <button class="soft" id="bBackLook">再去看看</button>
  </div>
</section>

<section class="panel" id="pClear">
  <div class="card">
    <div class="sub" id="cNum"></div>
    <h1 style="font-size:26px">真相大白！</h1>
    <div class="stars" id="cStars"></div>
    <div class="case" id="cStory"></div>
    <button id="bNext">下一个案子</button>
    <button class="soft" id="bClearHome">回到首页</button>
  </div>
</section>

<section class="panel" id="pWin">
  <div class="card">
    <h1 style="font-size:28px">五个案子全破了！</h1>
    <div class="sub">你是小区里最厉害的猫咪侦探</div>
    <div class="stars" id="wStars"></div>
    <button id="bWinHome">回到首页</button>
  </div>
</section>

<section class="panel" id="pPause">
  <div class="card"><h1 style="font-size:26px">暂停中</h1><button id="bResume">继续</button><button class="soft" id="bQuit">回到首页</button></div>
</section>

<script>
(() => {
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=Math.round(innerWidth*DPR); H=Math.round(innerHeight*DPR); cv.width=W; cv.height=H; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
resize(); addEventListener('resize',resize);
const wrap=d=>((d%360)+540)%360-180, rand=(a,b)=>a+Math.random()*(b-a), RAD=Math.PI/180;
const MAXV=95;

/* ================= 猫咪们 ================= */
const CATS=[
  {name:'橘子', breed:'橘猫', main:[244,166,94], chest:[255,244,228], ear:[244,166,94], inner:[255,184,194], tail:[226,132,60], paw:[255,244,228], eye:'#2b2235', iris:null},
  {name:'灰灰', breed:'灰猫', main:[163,171,189], chest:[238,240,245], ear:[163,171,189], inner:[255,184,194], tail:[139,147,166], paw:[238,240,245], eye:'#2b2235', iris:null},
  {name:'奶茶', breed:'奶油猫', main:[241,220,184], chest:[255,250,240], ear:[217,184,138], inner:[255,194,204], tail:[217,184,138], paw:[255,250,240], eye:'#2b2235', iris:null},
  {name:'小暹', breed:'暹罗猫', main:[243,231,211], chest:[251,245,234], ear:[90,68,54], inner:[138,106,88], tail:[90,68,54], paw:[90,68,54], eye:'#2a4a8a', iris:'#7fb6ff'},
  {name:'小黑', breed:'黑猫', main:[59,53,66], chest:[59,53,66], ear:[59,53,66], inner:[255,159,178], tail:[46,41,52], paw:[59,53,66], eye:'#1c1820', iris:'#ffd23f'},
];
/* ================= 案件 ================= */
// 线索坐标在猫咪自己的坐标系里（猫脸朝 +z，背后是 -z）
const CASES=[
  {cat:0, turn:42, place:'客厅', intro:'早上起来，客厅鱼缸里的小金鱼少了一条。橘子坐在客厅正中间，一脸无辜。',
   q:'橘子干了什么？', clues:[
     {id:'bone', name:'鱼骨头', p:[-.22,.02,-.62], n:[-.3,0,-1], s:.16, draw:'bone'},
     {id:'weed', name:'尾巴上挂着水草', p:[.05,.6,-.5], n:[0,.2,-1], s:.12, draw:'weed'},
     {id:'water',name:'地上一滩水', p:[.28,.01,-.5], n:[.5,0,-1], s:.2, draw:'puddle'} ],
   opts:['偷吃了鱼缸里的小金鱼','偷吃了桌上的红烧鱼','只是去喝了点水','什么都没干'], ans:0,
   story:'橘子半夜跳上鱼缸，伸爪子捞了一条小金鱼，尾巴还蘸了一身水草。'},
  {cat:1, turn:55, place:'阳台', intro:'阳台上传来“哐当”一声。等你跑过去，灰灰已经端端正正坐好了。',
   q:'灰灰干了什么？', clues:[
     {id:'shard', name:'碎花盆片', p:[.22,.02,-.62], n:[.3,0,-1], s:.17, draw:'shards'},
     {id:'mud',   name:'后爪上的泥巴', p:[-.2,.05,-.36], n:[-.5,0,-1], s:.1, draw:'mud'},
     {id:'petal', name:'一片花瓣', p:[-.3,.02,-.55], n:[-.5,0,-1], s:.1, draw:'petal'} ],
   opts:['在花园里挖了个洞','打翻了阳台上的花盆','摘了一朵花送给主人','打碎了自己的饭碗'], ans:1,
   story:'灰灰想去阳台晒太阳，一屁股把花盆挤了下去，还踩了一脚泥。'},
  {cat:2, turn:65, place:'奶奶的房间', intro:'奶奶织了一半的围巾不见了，只剩下一根毛衣针。奶茶在门口打哈欠。',
   q:'奶茶干了什么？', clues:[
     {id:'mess', name:'一大团乱毛线', p:[0,.02,-.68], n:[0,0,-1], s:.2, draw:'yarnmess'},
     {id:'tailyarn', name:'尾巴缠着红毛线', p:[.04,.45,-.56], n:[0,.1,-1], s:.12, draw:'tailyarn'},
     {id:'needle', name:'另一根毛衣针', p:[.3,.02,-.48], n:[.6,0,-1], s:.16, draw:'needle'} ],
   opts:['在玩新买的毛线球','偷偷学会了织毛衣','把奶奶织了一半的围巾拆了','把毛线藏进了衣柜'], ans:2,
   story:'奶茶咬住围巾的线头，一路拽、一路拆，最后把自己也缠了进去。'},
  {cat:3, turn:75, place:'卧室', intro:'主人的袜子最近总是一只一只地不见。小暹在床边坐着，眼神特别真诚。',
   q:'小暹干了什么？', clues:[
     {id:'sock1', name:'一只条纹袜', p:[-.25,.02,-.6], n:[-.4,0,-1], s:.15, draw:'sock'},
     {id:'sock2', name:'另一只花袜子', p:[.25,.02,-.62], n:[.4,0,-1], s:.15, draw:'sock2'},
     {id:'nest', name:'小窝里的袜子堆', p:[0,.02,-.8], n:[0,0,-1], s:.2, draw:'nest'} ],
   opts:['把拖鞋咬坏了','在帮主人洗袜子','跟楼下的狗换了礼物','把主人的袜子都藏进了自己的窝'], ans:3,
   story:'小暹觉得袜子有主人的味道，偷偷叼回自己的窝，攒了一大堆。'},
  {cat:4, turn:85, place:'餐厅', intro:'今晚是你的生日派对。打开冰箱前，你发现小黑舔着嘴坐在桌边。',
   q:'小黑干了什么？', clues:[
     {id:'cream', name:'胡子上的奶油', p:[.13,.56,.4], n:[.6,0,.8], s:.07, draw:'cream'},
     {id:'candle',name:'一根生日蜡烛', p:[-.26,.02,-.55], n:[-.5,0,-1], s:.15, draw:'candle'},
     {id:'box',   name:'空蛋糕盒', p:[.2,.02,-.7], n:[.3,0,-1], s:.22, draw:'box'} ],
   opts:['偷吃了你的生日蛋糕','偷偷吹灭了生日蜡烛','打翻了一杯牛奶','在给你准备惊喜'], ans:0,
   story:'小黑闻到奶油味，打开蛋糕盒吃了个精光，连蜡烛都叼出来玩了。'},
];

/* ================= 存档 ================= */
const SAVE='cat-secret-progress';
let P=(()=>{ try{ const s=JSON.parse(localStorage.getItem(SAVE)||'null'); if(s&&typeof s.level==='number') return s; }catch(e){} return {level:0,stars:[]}; })();
const writeSave=()=>{ try{ localStorage.setItem(SAVE,JSON.stringify(P)); }catch(e){} };

/* ================= 3D ================= */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function ellipsoid(out,c,r,col,nLat=7,nLon=12){
  const pt=(t,ph)=>[c[0]+r[0]*Math.cos(t)*Math.cos(ph),c[1]+r[1]*Math.sin(t),c[2]+r[2]*Math.cos(t)*Math.sin(ph)];
  for(let i=0;i<nLat;i++){ const t0=-Math.PI/2+Math.PI*i/nLat, t1=-Math.PI/2+Math.PI*(i+1)/nLat;
    for(let j=0;j<nLon;j++){ const p0=j/nLon*Math.PI*2, p1=(j+1)/nLon*Math.PI*2; const pts=[pt(t0,p0),pt(t0,p1),pt(t1,p1),pt(t1,p0)];
      const m=pts.reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4,s[2]+p[2]/4],[0,0,0]);
      out.push({pts,n:norm([(m[0]-c[0])/(r[0]*r[0]),(m[1]-c[1])/(r[1]*r[1]),(m[2]-c[2])/(r[2]*r[2])]),col,c:m}); } }
}
function pyramid(out,base,apex,col,innerCol){
  const ctr=base.reduce((s,p)=>[s[0]+p[0]/3,s[1]+p[1]/3,s[2]+p[2]/3],[0,0,0]);
  for(let i=0;i<3;i++){ const a=base[i], b=base[(i+1)%3]; let n=norm(cross(sub(b,a),sub(apex,a))); const m=[(a[0]+b[0]+apex[0])/3,(a[1]+b[1]+apex[1])/3,(a[2]+b[2]+apex[2])/3];
    const d=sub(m,ctr); if(n[0]*d[0]+n[1]*d[1]+n[2]*d[2]<0) n=[-n[0],-n[1],-n[2]]; out.push({pts:[a,b,apex],n,col,c:m});
    if(innerCol&&i===0){ const k=.55,off=.006; const q=[a,b].map(p=>[(p[0]-m[0])*k+m[0]+n[0]*off,(p[1]-m[1])*k+m[1]+n[1]*off,(p[2]-m[2])*k+m[2]+n[2]*off]); q.push([apex[0]*.7+m[0]*.3+n[0]*off,apex[1]*.7+m[1]*.3+n[1]*off,apex[2]*.7+m[2]*.3+n[2]*off]); out.push({pts:q,n,col:innerCol,c:[m[0]+n[0]*off,m[1]+n[1]*off,m[2]+n[2]*off]}); } }
}
function buildCat(C){ const F=[];
  ellipsoid(F,[0,.27,-.06],[.27,.24,.36],C.main); ellipsoid(F,[0,.29,.17],[.17,.17,.12],C.chest,6,10);
  ellipsoid(F,[-.2,.15,-.2],[.1,.13,.17],C.main,5,8); ellipsoid(F,[.2,.15,-.2],[.1,.13,.17],C.main,5,8);
  ellipsoid(F,[-.11,.05,.23],[.075,.05,.1],C.paw,4,8); ellipsoid(F,[.11,.05,.23],[.075,.05,.1],C.paw,4,8);
  ellipsoid(F,[0,.62,.2],[.27,.23,.24],C.main,8,14); ellipsoid(F,[0,.55,.38],[.1,.065,.06],C.chest,4,8);
  pyramid(F,[[-.24,.74,.19],[-.06,.8,.23],[-.15,.76,.09]],[-.2,.98,.2],C.ear,C.inner);
  pyramid(F,[[.06,.8,.23],[.24,.74,.19],[.15,.76,.09]],[.2,.98,.2],C.ear,C.inner);
  for(let i=0;i<10;i++){ const t=i/9; ellipsoid(F,[.06*Math.sin(t*3),.1+t*.55+.06*Math.sin(t*Math.PI),-.42-.16*Math.sin(t*Math.PI*.9)+t*.08],[.06,.06,.06],i>6?C.tail:C.main,4,6); }
  return F; }
const CAT_MESH=CATS.map(buildCat);
const DECALS=[ {k:'eye',p:[-.1,.66,.415],n:norm([-.35,.1,.93])},{k:'eye',p:[.1,.66,.415],n:norm([.35,.1,.93])},
  {k:'blush',p:[-.17,.57,.39],n:norm([-.55,0,.83])},{k:'blush',p:[.17,.57,.39],n:norm([.55,0,.83])},
  {k:'nose',p:[0,.585,.443],n:[0,.2,.98]},{k:'mouth',p:[0,.545,.44],n:[0,0,1]} ];
const LIGHT=norm([.45,.85,.35]);

/* ---------- 线索小图 ---------- */
function drawClue(c,k,s,found){
  c.save(); c.lineCap='round'; c.lineJoin='round';
  if(k==='bone'){ c.strokeStyle='#8a7a70'; c.lineWidth=s*.16; c.beginPath(); c.moveTo(-s*.8,0); c.lineTo(s*.6,0); c.stroke(); c.strokeStyle='#fffdf8'; c.lineWidth=s*.09; c.beginPath(); c.moveTo(-s*.8,0); c.lineTo(s*.6,0); c.stroke();
    for(let i=-2;i<=2;i++){ c.beginPath(); c.moveTo(i*s*.22,-s*.3); c.quadraticCurveTo(i*s*.22+s*.06,0,i*s*.22,s*.3); c.stroke(); }
    c.fillStyle='#fffdf8'; c.strokeStyle='#8a7a70'; c.lineWidth=s*.05; c.beginPath(); c.moveTo(s*.55,0); c.lineTo(s*.95,-s*.3); c.lineTo(s*.95,s*.3); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(-s*.85,0,s*.22,s*.18,0,0,7); c.fill(); c.stroke(); c.fillStyle='#3a2e2a'; c.beginPath(); c.arc(-s*.9,-s*.04,s*.05,0,7); c.fill(); }
  if(k==='weed'){ c.strokeStyle='#4fae6a'; c.lineWidth=s*.12; for(let j=-1;j<=1;j++){ c.beginPath(); c.moveTo(j*s*.3,-s*.2); for(let i=1;i<=4;i++) c.quadraticCurveTo(j*s*.3+(i%2?s*.25:-s*.25),-s*.2+i*s*.25-s*.12,j*s*.3,-s*.2+i*s*.25); c.stroke(); } }
  if(k==='puddle'){ c.fillStyle='rgba(120,190,240,.75)'; c.beginPath(); c.ellipse(0,0,s,s*.35,0,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-s*.3,-s*.08,s*.25,s*.07,0,0,7); c.fill(); }
  if(k==='shards'){ c.fillStyle='#d9744a'; [[-.6,0,.4],[.1,-.1,.5],[.6,.1,.35]].forEach(([x,y,r],i)=>{ c.beginPath(); c.moveTo(s*x,s*(y-r)); c.lineTo(s*(x+r),s*(y+r*.6)); c.lineTo(s*(x-r*.8),s*(y+r*.5)); c.closePath(); c.fill(); });
    c.fillStyle='#8a5a3a'; c.beginPath(); c.ellipse(0,s*.35,s*.7,s*.18,0,0,7); c.fill(); c.fillStyle='#5aa65a'; c.beginPath(); c.ellipse(-s*.1,s*.15,s*.12,s*.3,.4,0,7); c.fill(); }

/* ---------- 输入：拖动 = 走，轻点 = 收集线索 ---------- */

function tap(x,y){
  if(!G.running||G.ended) return;
  let best=null, bd=1e9; for(const h of lastClueHits){ const d=Math.hypot(h.x-x,h.y-y); if(d<h.r && d<bd){ bd=d; best=h; } }
  if(!best) return;
  if(G.found.has(best.cl.id)){ toast('这条已经记下了'); return; }
  G.found.add(best.cl.id); G.nervous=1.6; sfxFind(); try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
  toast('🔍 发现线索：'+best.cl.name); updateAnswerBtn();
}
function updateAnswerBtn(){ const n=G.found.size, b=$('#bAnswer'); b.disabled=n<2; b.textContent= n<2?`再找找线索（${n}/3）`:`我知道它干了什么！（${n}/3）`; }

/* ================= 逻辑 ================= */
function update(dt){

  // 猫咪一直转身挡住你（比你最快的速度慢一点）
  const d=wrap(G.p-G.F), step=K.turn*dt; G.F+= Math.abs(d)<=step? d : Math.sign(d)*step;

  // 线索格
  for(let i=0;i<3;i++){ const cl=K.clues[i], x=pad+i*H*.06, y=top+H*.065, s=H*.05; ctx.fillStyle=G.found.has(cl.id)?'#fff':'rgba(255,255,255,.4)'; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,s,s,s*.25); else ctx.rect(x,y,s,s); ctx.fill();
    if(G.found.has(cl.id)){ ctx.save(); ctx.translate(x+s/2,y+s/2); drawClue(ctx,cl.draw,s*.3,false); ctx.restore(); } else { ctx.fillStyle='rgba(58,46,42,.35)'; ctx.font=`800 ${s*.5}px sans-serif`; ctx.textAlign='center'; ctx.fillText('?',x+s/2,y+s/2+1); } }
  // 小地图：猫的背后方向
  const R=H*.055, cx=W-pad-R, cy=top+R*.7;
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
  const pr=G.p*RAD, map=ang=>{ const vx=Math.sin(ang*RAD), vz=Math.cos(ang*RAD); return [vx*Math.cos(pr)-vz*Math.sin(pr), vx*Math.sin(pr)+vz*Math.cos(pr)]; };
  const bk=map(G.F+180), bb=Math.atan2(bk[1],bk[0]);
  ctx.fillStyle='rgba(255,120,160,.6)'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R*.95,bb-.5,bb+.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgb('+CATS[ci].main.join(',')+')'; ctx.beginPath(); ctx.arc(cx,cy,R*.18,0,7); ctx.fill();
  ctx.fillStyle='#4a90e2'; ctx.beginPath(); ctx.arc(cx,cy+R*.8,R*.11,0,7); ctx.fill();
  ctx.fillStyle='#3a2e2a'; ctx.font=`600 ${H*.013}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('粉色 = 它背后',cx,cy+R+H*.004);
  // 提示
  if(G.t<6 && !G.ended){ ctx.font=`700 ${H*.02}px -apple-system,"PingFang SC",sans-serif`; const tip=G.touchMode?'一直往一个方向拖，甩开它！看到可疑的东西点一下':'一直往一边倾斜，绕得比它转得快！看到可疑的东西点一下';
    const tw=Math.min(W*.92,ctx.measureText(tip).width+H*.03); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); const ty=H*.8; if(ctx.roundRect) ctx.roundRect(W/2-tw/2,ty-H*.022,tw,H*.044,H*.022); else ctx.rect(W/2-tw/2,ty-H*.022,tw,H*.044); ctx.fill();
    ctx.fillStyle='#3a2e2a'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(tip,W/2,ty,W*.9); }
}
function frame(now){ const dt=Math.min(.05,(now-(G.last||now))/1000); G.last=now;
  if(G.running && !G.paused && !G.ended) update(dt); else if(G.ended) G.endT+=dt; else if(!G.running){ G.p+=dt*16; G.F=G.p*.6; }
  render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

/* ================= 流程 ================= */
function show(id){ document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===id)); $('#hud').classList.toggle('on',id===null); $('#answerBar').classList.toggle('on',id===null); }
function portrait(cvs,ci,size,p=25){ const d=Math.min(2,devicePixelRatio||1); cvs.width=size*d; cvs.height=size*d; cvs.style.width=size+'px'; cvs.style.height=size+'px'; renderScene(cvs.getContext('2d'),cvs.width,cvs.height,p,0,ci,'open',{cy:.56}); }
function renderGrid(){ const g=$('#lvGrid'); g.innerHTML='';
  CASES.forEach((K,i)=>{ const d=document.createElement('div'); const un=i<=P.level; d.className='lv'+(un?'':' lock')+(i===Math.min(P.level,CASES.length-1)?' cur':'');
    const c=document.createElement('canvas'); d.appendChild(c); portrait(c,K.cat,52); const t=document.createElement('div'); t.textContent=CATS[K.cat].name; d.appendChild(t);
    const s=document.createElement('small'); s.textContent='★'.repeat(P.stars[i]||0); d.appendChild(s); if(un) d.onclick=()=>openIntro(i); g.appendChild(d); });
  $('#bStart').textContent= P.level>=CASES.length?'全部破案 · 再看一遍':P.level>0?`继续（案件 ${P.level+1}）`:'开始'; }
function openIntro(i){ G.lv=i; const K=CASES[i]; $('#iNum').textContent=`案件 ${i+1} · ${K.place}`; $('#iName').textContent=`嫌疑猫：${CATS[K.cat].name}`; $('#iCase').textContent=K.intro; portrait($('#iPic'),K.cat,200,15); show('pIntro'); }
async function start(){ const ok=await enableSensor(); audioInit();
  Object.assign(G,{running:true,paused:false,ended:false,endT:0,p:0,F:0,t:0,found:new Set(),wrong:0,nervous:0,base:null,hasSensor:false,touchMode:!ok,last:0,dragV:0});
  updateAnswerBtn(); show(null); $('#bCal').style.display=ok?'':'none';
  if(ok) setTimeout(()=>{ if(G.running&&!G.hasSensor){ G.touchMode=true; $('#bCal').style.display='none'; } },1200); }
function ask(){ const K=CASES[G.lv];
  $('#aClues').innerHTML=K.clues.filter(c=>G.found.has(c.id)).map(c=>`<span>🔍 ${c.name}</span>`).join('');
  $('#aQ').textContent=K.q; const box=$('#aOpts'); box.innerHTML='';
  K.opts.forEach((o,i)=>{ const d=document.createElement('div'); d.className='opt'+(G.badOpts&&G.badOpts.has(i)?' bad':''); d.textContent=o;
    d.onclick=()=>{ if(i===K.ans) solve(); else { G.wrong++; (G.badOpts=G.badOpts||new Set()).add(i); sfxWrong(); d.classList.add('bad'); toast(`${CATS[K.cat].name}：喵~ 才不是呢`); } }; box.appendChild(d); });
  G.paused=true; show('pAsk'); }
function solve(){ const K=CASES[G.lv]; G.paused=false; G.ended=true; G.endT=0; show(null); $('#answerBar').classList.remove('on'); sfxWin();
  const stars= G.wrong===0 && G.found.size===3 ? 3 : G.wrong===0 ? 2 : 1;
  P.stars[G.lv]=Math.max(P.stars[G.lv]||0,stars); if(G.lv>=P.level) P.level=G.lv+1; writeSave();
  setTimeout(()=>{ G.running=false; $('#cNum').textContent=`案件 ${G.lv+1} · ${CATS[K.cat].name}`; $('#cStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    $('#cStory').textContent=K.story+(stars<3?(G.found.size<3?'（还有线索没找到哦）':'（猜错过一次）'):'');
    $('#bNext').textContent=G.lv>=CASES.length-1?'看看结局':'下一个案子'; show('pClear'); },1500); }
$('#bAnswer').onclick=ask;
$('#bBackLook').onclick=()=>{ G.paused=false; G.last=0; show(null); };
$('#bStart').onclick=()=>openIntro(Math.min(P.level,CASES.length-1));
$('#bGo').onclick=()=>{ G.badOpts=new Set(); start(); };
$('#bIntroBack').onclick=()=>{ renderGrid(); show('pStart'); };
$('#bNext').onclick=()=>{ if(G.lv>=CASES.length-1){ $('#wStars').textContent='★'.repeat(P.stars.reduce((a,b)=>a+(b||0),0)); show('pWin'); } else openIntro(G.lv+1); };
$('#bClearHome').onclick=$('#bWinHome').onclick=()=>{ G.ended=false; renderGrid(); show('pStart'); };
$('#bPause').onclick=()=>{ if(!G.running) return; G.paused=true; show('pPause'); $('#answerBar').classList.remove('on'); };
$('#bResume').onclick=()=>{ G.paused=false; G.last=0; show(null); };
$('#bQuit').onclick=()=>{ G.running=false; G.paused=false; G.ended=false; renderGrid(); show('pStart'); };
$('#bCal').onclick=()=>{ if(G.hasSensor){ G.base=G.gamma; G.sm=G.gamma; toast('已校准'); } };
$('#bMute').onclick=()=>{ G.muted=!G.muted; $('#bMute').textContent='声音：'+(G.muted?'关':'开'); };
renderGrid();
if(/[?&]debug/.test(location.search)) window.__dbg={G,wrap,hits:()=>lastClueHits,DPR:()=>DPR};
})();
</script>
